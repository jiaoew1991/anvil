name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# A workflow called by another runs under the caller's github.workflow, so
# its group stays apart from this workflow's own push and PR runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo fmt --check
      # clippy.toml forbids the SlateDB writes that return before durability,
      # so this step also guards the write path.
      - run: cargo clippy --all-targets --locked -- --deny warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      # Release mode: the recovery and crash tests wait on real timeouts and
      # flushes, and the debug build makes them several times slower.
      - run: cargo test --release --locked

  # Every release with a versioned storage format writes a store, and this
  # code must read each one (docs/storage-format.md, "Testing"). A debug
  # build: the stores are small, and it compiles faster than a release one.
  format-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, whose writers the check runs.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: scripts/format-compat.sh

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python, and 3.13, the newest
        # that PyO3 0.23 supported.
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      # An absolute path: maturin reads a bare `python` as the python/
      # source directory.
      - run: uvx maturin build --release --locked --interpreter "$(command -v python)"
      - run: uv venv --python "$(command -v python)" && uv pip install target/wheels/*.whl
      - run: .venv/bin/python python/tests/smoke.py
