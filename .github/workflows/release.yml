name: Release

# A release is cut by pushing a v<version> tag on a commit of main whose
# Cargo.toml and pyproject.toml already carry that version (see
# scripts/bump-version.sh). The unit tests and the bench bars must pass,
# then the wheels are built and the release is published with notes
# generated from the pull requests merged since the previous tag. Re-run a
# failed release from the Actions tab, or with workflow_dispatch on the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag against the code
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::run this workflow on a v<version> tag, not on $REF_TYPE $TAG"
            exit 1
          fi
          tag_version=${TAG#v}
          for manifest in Cargo.toml pyproject.toml; do
            version=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -n 1)
            if [ "$version" != "$tag_version" ]; then
              echo "::error::$TAG does not match $manifest version $version; run scripts/bump-version.sh $tag_version and merge it before tagging"
              exit 1
            fi
          done
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  bench:
    needs: version
    uses: ./.github/workflows/bench.yml

  wheels:
    needs: version
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist --interpreter 3.10 3.11 3.12 3.13
          before-script-linux: |
            # The manylinux image has no protoc; build.rs needs one.
            curl -sSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
            python3 -m zipfile -e /tmp/protoc.zip /usr/local
            chmod +x /usr/local/bin/protoc
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  release:
    needs: [ci, bench, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
