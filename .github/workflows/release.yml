name: Release

# A release is cut by merging a version bump to main: when Cargo.toml's
# version has no tag yet, the unit tests and the bench bars must pass, then
# the wheels are built and v<version> is tagged and released with notes
# generated from the pull requests merged since the previous tag.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          python_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          if [ "$cargo_version" != "$python_version" ]; then
            echo "::error::Cargo.toml ($cargo_version) and pyproject.toml ($python_version) versions differ"
            exit 1
          fi
          tag="v$cargo_version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  bench:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/bench.yml

  wheels:
    needs: version
    if: needs.version.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
      - if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist --interpreter 3.10 3.11 3.12 3.13
          before-script-linux: |
            # The manylinux image has no protoc; build.rs needs one.
            curl -sSLo /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protoc-31.1-linux-x86_64.zip
            python3 -m zipfile -e /tmp/protoc.zip /usr/local
            chmod +x /usr/local/bin/protoc
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  release:
    needs: [version, ci, bench, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/*.whl \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
