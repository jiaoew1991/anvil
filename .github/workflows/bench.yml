name: Bench

on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 UTC+8
  workflow_dispatch:
  workflow_call:

# Keyed like ci.yml, so a release's bench never cancels or queues behind
# the daily run.
concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The bars guard against regressions on GitHub's 4-vCPU runners, at
        # about 80% of the throughput first measured there (latency 8.4k
        # keys/s, contention 9.3k): room for runner noise, while the kind of
        # hot-path lock this is meant to catch cost a third. Revisit them once
        # the daily runs show the real spread. The runner is CPU-bound well
        # below production hardware, so it cannot check the 8.7k keys/s target
        # itself; that needs a 32-core host.
        include:
          # Each worker waits on two durable round trips per key.
          - profile: latency
            keys: 300000
            workers: 1000
            keys_per_sec_min: 6700
            ack_p99_ms_max: 300
          # Enough workers to saturate the runner, so contention on the hot
          # path shows up as lost throughput.
          - profile: contention
            keys: 600000
            workers: 4000
            keys_per_sec_min: 7400
            ack_p99_ms_max: 0
    name: bench (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - run: cargo test --release --locked --no-run
      - name: Run worker profile
        env:
          ANVIL_BENCH_KEYS: ${{ matrix.keys }}
          ANVIL_BENCH_WORKERS: ${{ matrix.workers }}
          ANVIL_BENCH_CLAIM_BATCH: 1
          ANVIL_BENCH_MIN_KEYS_PER_SEC: ${{ matrix.keys_per_sec_min }}
          ANVIL_BENCH_MAX_ACK_P99_MS: ${{ matrix.ack_p99_ms_max }}
        # A shared runner's throughput swings by close to half between runs
        # of the same commit, so one slow run is retried on a fresh store; a
        # regression misses the bar on both attempts.
        run: |
          ulimit -n "$(ulimit -Hn)"
          set -o pipefail
          for attempt in 1 2; do
            echo "=== attempt $attempt" | tee -a bench.log
            db_dir=$(mktemp -d "$RUNNER_TEMP/anvil-bench.XXXXXX")
            if ANVIL_BENCH_DB="file://$db_dir" \
              cargo test --release --locked --lib bench_worker_profile -- --ignored --nocapture \
              2>&1 | tee -a bench.log; then
              exit 0
            fi
            rm -rf "$db_dir"
          done
          exit 1
      - name: Summarize
        if: always()
        run: |
          {
            echo "### ${{ matrix.profile }}: bar ${{ matrix.keys_per_sec_min }} keys/s"
            echo '```'
            grep -E "===|dispatch:|process:|panicked|below the bar|above the bar" bench.log || echo "no bench output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
