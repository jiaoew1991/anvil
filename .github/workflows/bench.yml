name: Bench

on:
  schedule:
    - cron: "0 18 * * *" # daily, 02:00 UTC+8
  workflow_dispatch:
  workflow_call:

# Keyed like ci.yml, so a release's bench never cancels or queues behind
# the daily run.
concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: warn

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Each profile runs this code and the previous release alternately
        # on one runner (scripts/bench-compare.sh): a shared runner's speed
        # swings by close to half between jobs, so a fixed bar either misses
        # regressions or fails on a slow machine. The runner is CPU-bound well
        # below production hardware, so it cannot check the 8.7k keys/s target
        # itself; that needs a 32-core host.
        include:
          # Each worker waits on two durable round trips per key.
          - profile: latency
            keys: 300000
            workers: 1000
            ack_p99_ratio_max: 1.3
          # Enough workers to saturate the runner, so contention on the hot
          # path shows up as lost throughput.
          - profile: contention
            keys: 600000
            workers: 4000
            ack_p99_ratio_max: 0
    name: bench (${{ matrix.profile }})
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, the baseline the bench compares with.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Compare with the previous release
        env:
          ANVIL_BENCH_KEYS: ${{ matrix.keys }}
          ANVIL_BENCH_WORKERS: ${{ matrix.workers }}
          ANVIL_BENCH_CLAIM_BATCH: 1
          KEYS_PER_SEC_RATIO_MIN: 0.85
          ACK_P99_RATIO_MAX: ${{ matrix.ack_p99_ratio_max }}
        run: |
          ulimit -n "$(ulimit -Hn)"
          set -o pipefail
          scripts/bench-compare.sh 2>&1 | tee bench.log
      - name: Summarize
        if: always()
        run: |
          {
            echo "### ${{ matrix.profile }}"
            echo '```'
            grep -E "^===|^process:|panicked|^median|ratio|regressed|did not finish|no earlier" bench.log || echo "no bench output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
