[package]
name = "anvil-rs"
version = "0.5.0"
edition = "2021"
description = "Single-queue multi-consumer work queue with gRPC interface"
license = "Apache-2.0"

[lib]
name = "anvil_py"
crate-type = ["cdylib"]

[dependencies]
# PyO3 bindings
pyo3 = { version = "0.23", features = ["extension-module"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# gRPC
tonic = "0.12"
prost = "0.13"

# Storage - SlateDB embedded KV store
slatedb = "0.18"
object_store = { version = "0.11", features = ["aws"] }

# Concurrent data structures
dashmap = "6"
parking_lot = "0.12"

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
futures = "0.3"
opentelemetry = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
tower-layer = "0.3"
tower-service = "0.3"
http = "1"

[lints.clippy]
# tonic::Status is the error type of every RPC, fixed by the generated service
# traits, and it is larger than this lint's threshold.
result_large_err = "allow"

[dev-dependencies]
rand = "0.9"

[build-dependencies]
tonic-build = "0.12"
