syntax = "proto3";

package anvil;

option java_outer_classname = "AnvilProto";

// ============================================================================
// Anvil Service Definition (Protocol v2)
//
// Hot-path RPCs are unified:
//   - Claim:            replaces Claim + ClaimFromGroup
//   - Complete:         replaces Ack + Nack + AckAndForward + AckAndScatter
//   - Push:             replaces Push + PushBatch
//   - ClaimAndComplete: new combined RPC (halves round trips)
//
// Cold-path RPCs (admin, state, heartbeat) are unchanged.
//
// Error codes:
//   - FAILED_PRECONDITION: the caller no longer holds a claim it completes or
//     renews (settled, reclaimed or redelivered): drop the message. Or a
//     redrive into a finished queue.
//   - NOT_FOUND:           the queue or queue group does not exist.
//   - INVALID_ARGUMENT:    the request is malformed.
//   - RESOURCE_EXHAUSTED:  a bounded queue is full.
//   - INTERNAL:            the broker's storage failed. Retry.
// ============================================================================

service Anvil {
  // === Unified Hot Path ===

  // Claim messages from a queue or queue group
  rpc Claim(ClaimRequest) returns (ClaimResponse);

  // Complete message processing: ack, nack, forward, or scatter
  rpc Complete(CompleteRequest) returns (CompleteResponse);

  // Renew claims a worker is still making progress on, restarting their
  // claim_age_timeout window. A long task renews periodically from its
  // processing loop, so a stuck one stops renewing and is reclaimed.
  rpc RenewClaims(RenewClaimsRequest) returns (RenewClaimsResponse);

  // Push one or more messages to a queue
  rpc Push(PushRequest) returns (PushResponse);

  // Combined: complete previous batch + claim next batch in one round trip
  rpc ClaimAndComplete(ClaimAndCompleteRequest) returns (ClaimAndCompleteResponse);

  // === Heartbeat ===

  // Worker heartbeat to maintain lease
  rpc HeartbeatStream(stream HeartbeatPing) returns (stream HeartbeatPong);

  // === State API ===

  // Get state values by keys
  rpc StateGet(StateGetRequest) returns (StateGetResponse);

  // Put/delete state values
  rpc StatePut(StatePutRequest) returns (StatePutResponse);

  // === Admin API ===

  rpc CreateQueue(CreateQueueRequest) returns (CreateQueueResponse);
  rpc DeleteQueue(DeleteQueueRequest) returns (DeleteQueueResponse);
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);

  // === Dead Letter API ===

  // A message is dead-lettered when a nack asks for it, or when a nack or a
  // reclaim settles the last delivery its queue allows. It then waits,
  // neither pending nor claimed, until it is redriven or purged.
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  rpc RedriveDeadLetters(RedriveDeadLettersRequest) returns (RedriveDeadLettersResponse);
  rpc PurgeDeadLetters(PurgeDeadLettersRequest) returns (PurgeDeadLettersResponse);

  // === Queue Completion API ===

  rpc MarkQueueFinished(MarkQueueFinishedRequest) returns (MarkQueueFinishedResponse);
  rpc IsQueueFinished(IsQueueFinishedRequest) returns (IsQueueFinishedResponse);

  // === QueueGroup API ===

  rpc CreateQueueGroup(CreateQueueGroupRequest) returns (CreateQueueGroupResponse);
  rpc IsGroupFinished(IsGroupFinishedRequest) returns (IsGroupFinishedResponse);
  rpc GetGroupStats(GetGroupStatsRequest) returns (GetGroupStatsResponse);
  rpc MarkGroupFinished(MarkGroupFinishedRequest) returns (MarkGroupFinishedResponse);
}

// ============================================================================
// Unified Claim (replaces Claim + ClaimFromGroup)
// ============================================================================

message ClaimRequest {
  oneof source {
    string queue = 1;                    // plain queue claim
    GroupClaimSource group = 2;          // group claim (broker picks partition)
  }
  string worker_id = 3;
  string lease_id = 4;
  int32 batch_size = 5;
  int32 timeout_ms = 6;
}

message GroupClaimSource {
  string group_name = 1;
  repeated int32 assigned_partitions = 2;
  bool allow_steal = 3;
  int64 steal_pending_threshold = 4;
}

// Slim message — no queue (caller knows), no created_at (unused by workers)
message ClaimMessage {
  string msg_id = 1;
  bytes payload = 2;
  map<string, string> metadata = 3;
  string claim_token = 4;               // inline with message (was separate list)
  uint32 delivery_count = 5;            // 1 on first delivery; +1 per nack or reclaimed lease (not a broker restart); 1 again after a redrive
}

message ClaimResponse {
  repeated ClaimMessage messages = 1;
  bool has_more = 2;
  // Group claim info (empty for plain queue claims)
  string source_queue = 3;
  int32 source_partition = 4;
  // True when messages is empty AND the source queue/group is
  // finished + fully drained (pending=0, claimed=0; dead letters are settled).
  // Workers use this as the sole exit signal — no master notification needed.
  bool upstream_drained = 5;
  // Dead letters left in the source queue/group, whose work was not done;
  // reported when messages is empty, 0 otherwise.
  int64 dead_count = 6;
}

// ============================================================================
// Unified Complete (replaces Ack + Nack + AckAndForward + AckAndScatter)
// ============================================================================

message CompleteRequest {
  string upstream_queue = 1;
  repeated string msg_ids = 2;
  repeated string claim_tokens = 3;
  string worker_id = 4;
  string lease_id = 5;

  oneof action {
    AckAction ack = 6;                   // acknowledge (delete messages)
    ForwardAction forward = 7;           // ack + push to single downstream queue
    ScatterAction scatter = 8;           // ack + push to partition group
    NackAction nack = 9;                 // return messages to queue, or dead-letter them
  }

  // Optional atomic state update (applied with any action)
  StateUpdate state = 10;
}

message AckAction {}                     // just ack, no downstream

message ForwardAction {
  string downstream_queue = 1;
  repeated bytes payloads = 2;
}

message ScatterAction {
  string group_name = 1;
  repeated PartitionPayload partitions = 2;
}

// Returns the messages to the queue for retry, unless this was the last
// delivery the queue allows: then they are dead-lettered.
message NackAction {
  bool dead_letter = 1;                  // dead-letter now: a retry cannot succeed
  string reason = 2;                     // kept with any message dead-lettered, cut to its first 4 KiB
}

message StateUpdate {
  string namespace = 1;
  map<string, bytes> puts = 2;
  repeated string deletes = 3;
}

message CompleteResponse {
  bool success = 1;                     // always true: a failed complete is an error status
  int32 processed_count = 2;            // number of messages acked/nacked
  repeated string new_msg_ids = 3;      // downstream message IDs (forward/scatter)
}

// All or none: one claim that is no longer the caller's fails the call.
message RenewClaimsRequest {
  string queue = 1;
  repeated string msg_ids = 2;
  repeated string claim_tokens = 3;     // same length as msg_ids
  string worker_id = 4;
  string lease_id = 5;
}

message RenewClaimsResponse {}

// ============================================================================
// Unified Push (replaces Push + PushBatch)
// ============================================================================

message PushRequest {
  string queue = 1;
  repeated bytes payloads = 2;           // one or more payloads
  map<string, string> metadata = 3;      // applied to all messages
}

message PushResponse {
  repeated string msg_ids = 1;           // created message IDs (1:1 with payloads)
}

// ============================================================================
// Combined ClaimAndComplete (halves round trips)
// ============================================================================

message ClaimAndCompleteRequest {
  // Complete previous batch (optional — omit on first call)
  CompleteRequest complete = 1;

  // Claim next batch
  ClaimRequest claim = 2;
}

message ClaimAndCompleteResponse {
  // Result of complete (if complete was provided)
  CompleteResponse complete_result = 1;

  // Claimed messages
  ClaimResponse claim_result = 2;
}

// ============================================================================
// Heartbeat Messages
// ============================================================================

message HeartbeatPing {
  string worker_id = 1;
  string lease_id = 2;
  int64 timestamp = 3;
}

message HeartbeatPong {
  string lease_id = 1;
  bool ok = 2;
  int32 next_ping_ms = 3;
}

// ============================================================================
// State API Messages
// ============================================================================

message StateGetRequest {
  string namespace = 1;
  repeated string keys = 2;
}

message StateGetResponse {
  map<string, bytes> values = 1;
}

message StatePutRequest {
  string namespace = 1;
  map<string, bytes> puts = 2;
  repeated string deletes = 3;
}

message StatePutResponse {
  int32 puts_count = 1;
  int32 deletes_count = 2;
}

// ============================================================================
// Admin API Messages
// ============================================================================

message CreateQueueRequest {
  string queue = 1;
  uint64 max_pending = 2;  // 0 = unlimited (default); 0 keeps an existing queue's
  // Deliveries a message gets before a failed one is dead-lettered; 0 =
  // unlimited. Absent: the broker's default for a new queue, and the current
  // limit for an existing one.
  optional uint32 max_deliveries = 3;
}

message CreateQueueResponse {
  bool created = 1;
}

message DeleteQueueRequest {
  string queue = 1;
}

message DeleteQueueResponse {
  bool deleted = 1;
  int32 messages_deleted = 2;
}

message GetStatsRequest {
  string queue = 1;                      // empty = all queues; an unknown queue is NOT_FOUND
}

message GetStatsResponse {
  map<string, QueueStats> queues = 1;
  int32 total_workers = 2;
  int64 uptime_secs = 3;
}

message QueueStats {
  string queue = 1;
  int64 pending_count = 2;
  int64 claimed_count = 3;
  int64 total_pushed = 4;
  int64 total_acked = 5;
  int64 dead_count = 6;                  // dead letters waiting for a redrive or a purge
  int64 total_purged = 7;                // dead letters purged; pushed = pending + claimed + acked + dead + purged
}

// ============================================================================
// Dead Letter API Messages
//
// Each call handles at most 1000 dead letters. Redrive and purge skip the
// msg_ids that hold no dead letter and report them, so a retried call
// succeeds.
// ============================================================================

message ListDeadLettersRequest {
  string queue = 1;
  string start_after = 2;                // msg_id to list after; empty = from the first
  uint32 limit = 3;                      // 1..=1000
  // Letters without payload or metadata, so a page holds up to `limit` ids
  // whatever the bodies weigh: for paging through letters to redrive or purge.
  bool ids_only = 4;
}

// A page holds at most `limit` letters and, unless a single letter is
// larger, at most 1 MiB of them, payloads included, so it decodes under a
// client's default 4 MiB message limit.
message ListDeadLettersResponse {
  repeated DeadLetter dead_letters = 1;  // in msg_id order
  string next_start_after = 2;           // start_after of the next page; empty once the list is exhausted
}

message DeadLetter {
  string msg_id = 1;
  bytes payload = 2;
  map<string, string> metadata = 3;
  uint32 delivery_count = 4;             // deliveries it had, the last one included
  string cause = 5;                      // "nack_limit", "reclaim_limit" or "rejected"
  string reason = 6;                     // the last nack's reason; empty for a reclaim
  string worker_id = 7;                  // the worker that held the last claim
  uint64 dead_at_ms = 8;                 // wall clock, milliseconds since the Unix epoch
}

// Returns dead letters to the tail of pending with a fresh delivery count.
// A finished queue refuses it with FAILED_PRECONDITION, unless `reopen`:
// then the redrive clears the finished mark in the same write, so
// upstream_drained is false again. Consumers that already exited on it must
// be started again.
message RedriveDeadLettersRequest {
  string queue = 1;
  repeated string msg_ids = 2;
  bool reopen = 3;
}

message RedriveDeadLettersResponse {
  repeated string redriven = 1;
  repeated string missing = 2;
}

// Deletes dead letters; they count toward total_purged.
message PurgeDeadLettersRequest {
  string queue = 1;
  repeated string msg_ids = 2;
}

message PurgeDeadLettersResponse {
  repeated string purged = 1;
  repeated string missing = 2;
}

// ============================================================================
// Queue Completion API Messages
// ============================================================================

message MarkQueueFinishedRequest {
  string queue = 1;
}

message MarkQueueFinishedResponse {
  bool success = 1;
}

message IsQueueFinishedRequest {
  string queue = 1;
}

message IsQueueFinishedResponse {
  bool finished = 1;
  bool drained = 2;
  bool safe_to_exit = 3;
  int64 pending_count = 4;
  int64 claimed_count = 5;
  int64 dead_count = 6;                  // dead letters left, settled but not done
}

// ============================================================================
// QueueGroup API Messages
// ============================================================================

message CreateQueueGroupRequest {
  string group_name = 1;
  int32 num_partitions = 2;
  uint64 max_pending_per_partition = 3;  // 0 = unlimited (default)
  optional uint32 max_deliveries = 4;    // per partition, as CreateQueueRequest
}

message CreateQueueGroupResponse {
  repeated string queue_names = 1;
  int32 version = 2;
  bool created = 3;
}

message PartitionPayload {
  int32 partition_id = 1;
  repeated bytes payloads = 2;
}

message IsGroupFinishedRequest {
  string group_name = 1;
}

message IsGroupFinishedResponse {
  bool all_finished = 1;
  bool all_drained = 2;
  bool safe_to_exit = 3;
  repeated PartitionStatus partitions = 4;
  int64 dead_count = 5;                  // dead letters left over every partition
}

message PartitionStatus {
  int32 partition_id = 1;
  int64 pending_count = 2;
  int64 claimed_count = 3;
  bool finished = 4;
  int64 dead_count = 5;
}

message GetGroupStatsRequest {
  string group_name = 1;
}

message GetGroupStatsResponse {
  repeated PartitionStats partitions = 1;
  int64 total_pending = 2;
  int64 total_claimed = 3;
  int64 max_partition_pending = 4;
  int64 median_partition_pending = 5;
  float skew_ratio = 6;
  repeated int32 hot_partitions = 7;
  int32 version = 8;
}

message PartitionStats {
  int32 partition_id = 1;
  int64 pending_count = 2;
  int64 claimed_count = 3;
  int64 total_pushed = 4;
  int64 total_acked = 5;
  int64 dead_count = 6;
  int64 total_purged = 7;
}

message MarkGroupFinishedRequest {
  string group_name = 1;
}

message MarkGroupFinishedResponse {
  bool success = 1;
  int32 queues_marked = 2;
}
